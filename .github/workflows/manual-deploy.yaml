          pip install --user snowflake-connector-python
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update DDL from Snowflake (run ddl_sync.py)
        if: ${{ github.event.inputs.deployment_type != 'initial_setup' }}
        env:
