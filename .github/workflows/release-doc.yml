name: Generate Release Management Document

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-doc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate release management Word document
        run: |
          python scripts/generate_release_doc.py \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-branch "${{ github.event.pull_request.base.ref }}" \
            --head-branch "${{ github.event.pull_request.head.ref }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-title "${{ github.event.pull_request.title }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --repo "${{ github.repository }}" \
            --output "release-docs/PR-${{ github.event.pull_request.number }}-release-management.docx"

      - name: Upload Word document artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-management-doc-pr-${{ github.event.pull_request.number }}
          path: release-docs/*.docx
          if-no-files-found: error
