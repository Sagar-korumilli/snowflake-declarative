name: PR Summary Document

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to summarize"
        required: true
        default: "main"

      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true

      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      COPILOT_CLI_URL: http://127.0.0.1:4321

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node (Copilot CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Start Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          nohup copilot --headless --port 4321 > copilot.log 2>&1 &
          sleep 8

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install requests python-docx github-copilot-sdk

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_pr_summary.py

      - name: Upload document
        uses: actions/upload-artifact@v4
        with:
          name: pr-summary
          path: output/*.docx
