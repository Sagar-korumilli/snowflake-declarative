name: "❄️ Manual Rollback (non-table objects)"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to roll back (defaults to latest closed PR)"
        required: false
        type: string
      path:
        description: "Root path to Snowflake SQL (default: snowflake/)"
        required: false
        default: "snowflake/"
        type: string
      dry_run:
        description: "Don't execute DDL, just print"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  pull-requests: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

jobs:
  determine:
    name: Determine PR and target environment
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.set.outputs.pr_number }}
      base_ref: ${{ steps.set.outputs.base_ref }}
      merge_sha: ${{ steps.set.outputs.merge_sha }}
      target_env: ${{ steps.set.outputs.target_env }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Find PR / decide target env
        id: set
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR_INPUT: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/${REPO}"

          # 1) Determine PR object (either user-supplied or latest merged)
          if [ -n "${PR_INPUT}" ]; then
            echo "Using provided PR: ${PR_INPUT}"
            pr_json=$(curl -s -H "Authorization: token ${GH_TOKEN}" "${API}/pulls/${PR_INPUT}")
          else
            echo "No PR provided — finding latest merged PR..."
            # fetch recent closed PRs and pick first merged one
            pr_json=$(curl -s -H "Authorization: token ${GH_TOKEN}" "${API}/pulls?state=closed&per_page=50" | jq '[.[] | select(.merged_at != null)][0]')
            if [ "${pr_json}" = "null" ] || [ -z "${pr_json}" ]; then
              echo "No merged PRs found."
              exit 1
            fi
          fi

          pr_number=$(echo "$pr_json" | jq -r '.number')
          base_ref=$(echo "$pr_json" | jq -r '.base.ref')
          merge_sha=$(echo "$pr_json" | jq -r '.merge_commit_sha')

          echo "PR: $pr_number, base_ref: $base_ref, merge_sha: $merge_sha"

          # default target mapping
          target_env=""

          case "$base_ref" in
            dev)
              target_env="development"
              ;;
            main)
              target_env="production"
              ;;
            release)
              # check workflow runs for the deploy workflow using head_sha = merge_sha
              if [ -z "$merge_sha" ] || [ "$merge_sha" = "null" ]; then
                echo "Warning: merge_commit_sha missing; defaulting release -> qa."
                target_env="qa"
              else
                echo "Looking for workflow runs with head_sha=${merge_sha} to decide between QA / UAT..."
                runs=$(curl -s -H "Authorization: token ${GH_TOKEN}" "${API}/actions/runs?head_sha=${merge_sha}&per_page=50")
                # pick the run for your deploy workflow by name (adjust name if different)
                run_id=$(echo "$runs" | jq -r '.workflow_runs[] | select(.name=="❄️ Snowflake Full Deploy") | .id' | head -n1 || true)

                if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
                  echo "Found workflow run id: $run_id — fetching jobs..."
                  jobs=$(curl -s -H "Authorization: token ${GH_TOKEN}" "${API}/actions/runs/${run_id}/jobs")
                  # prefer deploy-uat success
                  uat_ok=$(echo "$jobs" | jq -r '.jobs[] | select(.name=="deploy-uat") | .conclusion' | grep -E '^success$' || true)
                  qa_ok=$(echo "$jobs" | jq -r '.jobs[] | select(.name=="deploy-qa") | .conclusion' | grep -E '^success$' || true)

                  if [ -n "$uat_ok" ]; then
                    target_env="uat"
                  elif [ -n "$qa_ok" ]; then
                    target_env="qa"
                  else
                    echo "No successful deploy-uat/deploy-qa job found in that run — defaulting release -> qa"
                    target_env="qa"
                  fi
                else
                  echo "No deploy workflow run found for merge sha; defaulting release -> qa"
                  target_env="qa"
                fi
              fi
              ;;
            *)
              echo "Unknown base.ref '$base_ref' — defaulting to 'qa'"
              target_env="qa"
              ;;
          esac

          # export outputs
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${base_ref}"   >> "$GITHUB_OUTPUT"
          echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"
          echo "target_env=${target_env}" >> "$GITHUB_OUTPUT"
          echo "Determined target_env=${target_env} for PR ${pr_number}"

  # RUN rollback job in the correct GitHub environment so environment secrets are resolved from that environment
  rollback-development:
    name: Rollback → development
    needs: determine
    if: ${{ needs.determine.outputs.target_env == 'development' }}
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 30
    steps:
      - name: Checkout repo (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "Sagar-korumilli"
          git config user.email "sagar.korumilli11@gmail.com"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python requests GitPython
      - name: Validate Snowflake env vars (dev)
        run: |
          for v in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_PRIVATE_KEY SNOWFLAKE_PRIVATE_KEY_PASSPHRASE SNOWFLAKE_ROLE SNOWFLAKE_WAREHOUSE SNOWFLAKE_DATABASE; do
            if [ -z "${!v}" ]; then
              echo "❌ Missing $v"
              exit 1
            fi
          done
      - name: Write private key file
        run: |
          echo "$SNOWFLAKE_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
      - name: Generate connections.toml
        run: |
          cat > connections.toml <<EOF
          [connections]
            account             = "${SNOWFLAKE_ACCOUNT}"
            user                = "${SNOWFLAKE_USER}"
            private_key_file    = "key.pem"
            private_key_file_pwd= "${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE}"
            authenticator       = "snowflake_jwt"
            role                = "${SNOWFLAKE_ROLE}"
            warehouse           = "${SNOWFLAKE_WAREHOUSE}"
            database            = "${SNOWFLAKE_DATABASE}"
          EOF
          chmod 600 connections.toml
      - name: Run rollback script (dev)
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          PR_INPUT="${{ needs.determine.outputs.pr_number }}"
          PATH_FILTER="${{ github.event.inputs.path }}"
          DRY="${{ github.event.inputs.dry_run }}"

          CMD="python scripts/rollback.py --repo \"$REPO\" --token \"${GH_TOKEN}\" --path \"$PATH_FILTER\" --connections-file connections.toml --connection-name connections"
          if [ -n "$PR_INPUT" ]; then CMD="$CMD --pr $PR_INPUT"; fi
          if [ "$DRY" = "true" ]; then CMD="$CMD --dry-run"; fi

          echo "Executing: $CMD"
          eval $CMD
      - name: Clean up
        if: always()
        run: |
          rm -f key.pem connections.toml
          echo "✔️ Rollback to development complete."

