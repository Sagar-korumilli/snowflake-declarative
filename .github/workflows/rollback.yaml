name: "Manual Rollback (non-table objects)"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to roll back (defaults to latest closed PR)"
        required: false
        type: string
      path:
        description: "Root path to Snowflake SQL (default: snowflake/)"
        required: false
        default: "snowflake/"
        type: string
      dry_run:
        description: "Don't execute DDL, just print"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  rollback:
    runs-on: ubuntu-latest

    env:
      # Snowflake (your script reads these directly)
      SNOWFLAKE_ACCOUNT:               ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:                  ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE:                  ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE:             ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE:              ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_PRIVATE_KEY:           ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}

      # GitHub token your script uses for the API
      GH_TOKEN:                        ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    steps:
      - name: Checkout (depth=0 for PR base/head resolution not strictly required, but handy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-connector-python requests

      - name: Run rollback_non_table_only.py
        env:
          # your script expects --token, but also reads GH_TOKEN from env in examples; we pass both.
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          PR_INPUT="${{ github.event.inputs.pr_number }}"
          PATH_FILTER="${{ github.event.inputs.path }}"
          DRY="${{ github.event.inputs.dry_run }}"

          CMD="python scripts/rollback.py --repo \"$REPO\" --token \"${{ secrets.PERSONAL_ACCESS_TOKEN }}\" --path \"$PATH_FILTER\""
          if [ -n "$PR_INPUT" ]; then
            CMD="$CMD --pr $PR_INPUT"
          fi
          if [ "$DRY" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          echo "Executing: $CMD"
          eval $CMD
