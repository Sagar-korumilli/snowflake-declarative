name: "❄️ Manual Rollback"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to roll back (defaults to latest closed PR)"
        required: false
        type: string
      path:
        description: "Root path to Snowflake SQL (default: snowflake/)"
        required: false
        default: "snowflake/"
        type: string
      dry_run:
        description: "Don't execute DDL, just print"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write
  pull-requests: read
  actions: read

env:
  GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

jobs:
  determine:
    name: Determine PR and target environment
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.set.outputs.pr_number }}
      target_env: ${{ steps.set.outputs.target_env }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Find PR / decide target env
        id: set
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          PR_INPUT="${{ github.event.inputs.pr_number }}"
          API="https://api.github.com/repos/${REPO}"

          if [ -n "$PR_INPUT" ]; then
            echo "Using provided PR: $PR_INPUT"
            pr_json=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/pulls/$PR_INPUT")
          else
            echo "No PR provided — finding latest merged PR..."
            pr_json=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/pulls?state=closed&per_page=20" | jq '[.[] | select(.merged_at != null)][0]')
          fi

          pr_number=$(echo "$pr_json" | jq -r '.number')
          base_ref=$(echo "$pr_json" | jq -r '.base.ref')

          case "$base_ref" in
            dev) target_env="development" ;;
            release) target_env="qa" ;; # adjust if you want UAT logic
            main) target_env="production" ;;
            *) target_env="qa" ;;
          esac

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "target_env=$target_env" >> "$GITHUB_OUTPUT"

  rollback-development:
    name: Rollback → development
    needs: determine
    if: ${{ needs.determine.outputs.target_env == 'development' }}
    runs-on: ubuntu-latest
    environment: development
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WH: ${{ secrets.SNOWFLAKE_WH }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install snowflake-connector-python requests GitPython

      - name: Run rollback in dev
        run: |
          echo "Rolling back in development..."
          python scripts/rollback.py \
            --repo "${{ github.repository }}" \
            --token "$GH_TOKEN" \
            --path "${{ github.event.inputs.path }}" \
            --pr "${{ needs.determine.outputs.pr_number }}" 

  rollback-qa:
    name: Rollback → qa
    needs: determine
    if: ${{ needs.determine.outputs.target_env == 'qa' }}
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --upgrade pip
          pip install snowflake-connector-python requests GitPython
      - run: |
          echo "Rolling back in QA..."
          python scripts/rollback.py \
            --repo "${{ github.repository }}" \
            --token "$GH_TOKEN" \
            --path "${{ github.event.inputs.path }}" \
            --pr "${{ needs.determine.outputs.pr_number }}" 

  rollback-uat:
    name: Rollback → uat
    needs: determine
    if: ${{ needs.determine.outputs.target_env == 'uat' }}
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --upgrade pip
          pip install snowflake-connector-python requests GitPython
      - run: |
          echo "Rolling back in UAT..."
          python scripts/rollback.py \
            --repo "${{ github.repository }}" \
            --token "$GH_TOKEN" \
            --path "${{ github.event.inputs.path }}" \
            --pr "${{ needs.determine.outputs.pr_number }}" 

  rollback-production:
    name: Rollback → production
    needs: determine
    if: ${{ needs.determine.outputs.target_env == 'production' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --upgrade pip
          pip install snowflake-connector-python requests GitPython
      - run: |
          echo "Rolling back in production..."
          python scripts/rollback.py \
            --repo "${{ github.repository }}" \
            --token "$GH_TOKEN" \
            --path "${{ github.event.inputs.path }}" \
            --pr "${{ needs.determine.outputs.pr_number }}" 
